name: iOS IPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project NexusMusic.xcodeproj -scheme NexusMusic -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NexusMusic.app Payload/
          zip -qr NexusMusic-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NexusMusic-unsigned-ipa
          path: NexusMusic-unsigned.ipa
          if-no-files-found: error
