name: SimplexMusic
options:
  developmentLanguage: de
  deploymentTarget:
    iOS: '26.0'
packages:
  SFBAudioEngine:
    url: https://github.com/sbooth/SFBAudioEngine
    exactVersion: 0.14.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 2
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    OTHER_LDFLAGS: ['$(inherited)', '-ObjC']
targets:
  SimplexMusic:
    type: application
    platform: iOS
    sources: [app]
    dependencies:
      - package: SFBAudioEngine
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: Simplex Music Player
        CFBundleName: Simplex Music Player
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UISupportsDocumentBrowser: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mp3, public.mpeg-4-audio, org.xiph.flac, org.xiph.ogg-audio, public.data]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.robin.nexusmusic
        PRODUCT_NAME: SimplexMusic
        SWIFT_OBJC_BRIDGING_HEADER: app/Bridging.h
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: 'Ember Glacier Obsidian'
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
  SimplexMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SimplexMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.robin.simplexmusic.tests
  SimplexMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SimplexMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.robin.simplexmusic.uitests
schemes:
  SimplexMusic:
    build:
      targets:
        SimplexMusic: all
    test:
      targets: [SimplexMusicTests, SimplexMusicUITests]
